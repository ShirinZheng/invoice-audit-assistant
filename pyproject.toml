[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-audit-assistant"
version = "1.0.0"
description = "Local-first invoice audit assistant with deterministic policy decisions, RAG citations, and optional DeepSeek explanations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ShirinZheng" }]
keywords = ["invoice", "audit", "rag", "deepseek", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.50,<4",
  "pillow>=10.4,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "pytesseract>=0.3.13,<1",
  "rich>=13.8,<16",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/ShirinZheng/invoice-audit-assistant"
Repository = "https://github.com/ShirinZheng/invoice-audit-assistant"
Issues = "https://github.com/ShirinZheng/invoice-audit-assistant/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.data-files]
"share/invoice-audit-assistant/web" = [
  "web/index.html",
  "web/styles.css",
  "web/app.js",
]
"share/invoice-audit-assistant/data/invoices/raw" = ["data/invoices/raw/*.txt"]
"share/invoice-audit-assistant/data/knowledge_base" = ["data/knowledge_base/*.md"]
"share/invoice-audit-assistant/evals/cases" = ["evals/cases/*.json"]
"share/invoice-audit-assistant/evals/baseline" = ["evals/baseline/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires DEEPSEEK_API_KEY and network access to the DeepSeek API",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "evals/baseline", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
